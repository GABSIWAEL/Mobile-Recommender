<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Recommendation Results</title>
    <style>
           body::before {
     content: "  Une Version Demonstartive Sous Les Droits Du";
     position: fixed;
     top: 50%;
     left: 50%;
     transform: translate(-50%, -50%) rotate(-45deg);
     font-size: 40px;
     font-weight: bold;
     color: rgba(255, 0, 0, 0.206);
     z-index: 1000;
     pointer-events: none;
     white-space: pre;
     /* Preserve whitespace and allow line breaks */
   }

   body::after {
     content: "     Créateur Wael Gabsi";
     position: fixed;
     top: 60%;
     left: 50%;
     transform: translate(-50%, -50%) rotate(-45deg);
     font-size: 40px;
     font-weight: bold;
     color: rgba(255, 0, 0, 0.206);
     z-index: 1000;
     pointer-events: none;
     white-space: pre;
     /* Preserve whitespace and allow line breaks */
   }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h1>Phone Recommendation Results</h1>

    <table>
        <thead>
            <tr>
                <th>Brand</th>
                <th>Model</th>
                <th>Network Technology</th>
                <th>Display Type</th>
                <th>Price</th>
                <th>Battery</th>
                <!-- Add more headers as needed -->
            </tr>
        </thead>
        <tbody>
            {% for phone in phones %}
            <tr>
                <td>{{ phone['Brand'] }}</td>
                <td>{{ phone['Model'] }}</td>
                <td>{{ phone['Network Technology'] }}</td>
                <td>{{ phone['Display Type'] }}</td>
                <td>{{ phone['Price'] }}</td>
                <td>{{ phone['Battery'] }}</td>
                <!-- Add more columns as needed -->
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>

</html>
